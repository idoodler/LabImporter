name: Build Android
run-name: Build Android (${{ github.ref_name }})

# Compiles and tests the shared KMP module and the Android app. Needs no
# secrets: the APK is signed with the runner's debug key (test builds only).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Tests, translations, lint and APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Every Android string is translated into all shipped languages, and the
      # generated values-*/strings.xml are up to date.
      - name: Translations
        run: |
          python3 tools/xcstrings_to_android.py --check
          git diff --exit-code -- androidApp/src/main/res

      - name: Test, lint and assemble
        run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:lintRelease :androidApp:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: labimporter-android
          path: androidApp/build/outputs/apk/release/*.apk
