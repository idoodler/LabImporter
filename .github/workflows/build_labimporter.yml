name: 4. Build LabImporter
run-name: Build LabImporter (${{ github.ref_name }})
on:
  workflow_dispatch:
  schedule:
    # Monthly build on the first Sunday of the month at 07:00 UTC. Cron can't say
    # "first Sunday" (a day-of-month range is OR'ed with the weekday, so
    # "0 7 1-7 * 0" would also run every Sunday): it fires every Sunday and the
    # `first_sunday` job lets only the one in the month's first seven days through.
    - cron: "0 7 * * 0"

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  first_sunday:
    name: Scheduled for today?
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check_certs:
    name: Check Certificates
    needs: [first_sunday]
    if: needs.first_sunday.outputs.run == 'true'
    uses: ./.github/workflows/create_certs.yml
    secrets: inherit

  build:
    name: Build
    needs: [check_certs]
    # Xcode 27.1 (iOS 27.1 SDK): built with an older SDK the app runs in
    # compatibility mode on iPhone Duo. Only the xcode-27 image has it.
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer

      - name: Checkout Repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      - name: Stamp Git metadata into Info.plist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PLIST="LabImporter/Info.plist"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          # Whether this repo has Issues enabled drives the "Report an Issue"
          # row in Settings; query the API and fall back to empty (unknown).
          HAS_ISSUES=$(gh api "repos/${{ github.repository }}" --jq '.has_issues' 2>/dev/null || true)
          case "$HAS_ISSUES" in true|false) ;; *) HAS_ISSUES="" ;; esac
          for entry in \
            "GitBranch:${{ github.ref_name }}" \
            "GitCommit:${GITHUB_SHA:0:7}" \
            "GitRepositoryURL:${REPO_URL}" \
            "GitHasIssues:${HAS_ISSUES}"; do
            key="${entry%%:*}"
            value="${entry#*:}"
            /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :${key} string ${value}" "$PLIST"
          done

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: SwiftLint
        run: |
          if ! command -v swiftlint &>/dev/null; then
            brew install swiftlint
          fi
          swiftlint lint --strict --reporter github-actions-logging

      # The Xcode "Build shared Kotlin" phase runs Gradle (shared/ KMP module).
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_labimporter
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: |
            artifacts
            buildlog
