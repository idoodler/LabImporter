[versions]
agp = "9.4.1"
kotlin = "2.4.20"
skie = "0.10.15"
coroutines = "1.11.0"
serialization = "1.12.0"
datetime = "0.8.0"
sqlite = "2.7.1"
composeBom = "2026.09.00"
material3 = "1.5.0-beta01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
splashscreen = "1.2.0"
healthConnect = "1.2.0-alpha06"
genaiPrompt = "1.0.0-beta4"
litertlm = "0.18.1"
